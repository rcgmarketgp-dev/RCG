<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Industrial Machinery / Excavator Crane & Cog Icon -->
  <g filter="url(#shadow)" transform="translate(48, 48) scale(0.8125)">
    <!-- Central Cog Wheel Outer Ring -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="14" stroke-dasharray="24 16" opacity="0.6" />
    
    <!-- Heavy Industrial Excavator Silhouette & Tech Elements -->
    <path d="M120 370 h272 a24 24 0 0 0 24 -24 v-16 a24 24 0 0 0 -24 -24 h-40 l-24 -60 h-80 l-20 60 h-108 a24 24 0 0 0 -24 24 v16 a24 24 0 0 0 24 24 z" fill="url(#metal)" />
    
    <!-- Tracks / Wheels -->
    <rect x="130" y="340" width="252" height="34" rx="17" fill="#0f172a" />
    <circle cx="160" cy="357" r="10" fill="url(#gold)" />
    <circle cx="196" cy="357" r="10" fill="url(#gold)" />
    <circle cx="232" cy="357" r="10" fill="url(#gold)" />
    <circle cx="268" cy="357" r="10" fill="url(#gold)" />
    <circle cx="304" cy="357" r="10" fill="url(#gold)" />
    <circle cx="340" cy="357" r="10" fill="url(#gold)" />

    <!-- Machinery Body / Cabin -->
    <path d="M170 306 v-86 a16 16 0 0 1 16 -16 h76 a16 16 0 0 1 16 16 v86 z" fill="url(#gold)" />
    <!-- Cabin Window -->
    <path d="M184 220 h50 a8 8 0 0 1 8 8 v50 h-58 z" fill="#1e1b4b" />

    <!-- Hydraulic Boom Arm -->
    <line x1="265" y1="230" x2="350" y2="140" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" />
    <line x1="350" y1="140" x2="400" y2="200" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" />
    <circle cx="265" cy="230" r="14" fill="#ffffff" />
    <circle cx="350" cy="140" r="12" fill="#ffffff" />
    
    <!-- Bucket -->
    <path d="M400 200 l24 30 a16 16 0 0 1 -10 24 l-34 4 a10 10 0 0 1 -10 -12 l12 -42 z" fill="url(#metal)" />

    <!-- AI Sparkle Badge on top left -->
    <g transform="translate(100, 100) scale(1.4)">
      <path d="M20 0 L24 14 L38 20 L24 26 L20 40 L16 26 L2 20 L16 14 Z" fill="url(#gold)" />
    </g>
    <g transform="translate(380, 80) scale(0.9)">
      <path d="M20 0 L24 14 L38 20 L24 26 L20 40 L16 26 L2 20 L16 14 Z" fill="#60a5fa" />
    </g>
  </g>
</svg>
