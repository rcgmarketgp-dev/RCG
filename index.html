    <script>
      // Suppress Vite HMR WebSocket connection errors in iframe/Cloud Run environment
      window.addEventListener('error', function (e) {
        if (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || e.message.includes('ModuleRunnerTransport'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || e.reason.stack || String(e.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('ModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
